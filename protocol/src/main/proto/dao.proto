syntax = "proto3";

package dao;

option java_package = "dao.protocol";
option java_multiple_files = true;

message Envelope {
  oneof payload {
    Login    login = 1;
    LoginOk  login_ok = 2;
    Input    input = 3;
    Snapshot snapshot = 4;
    Ping     ping = 5;
    Pong     pong = 6;
  }
}

message Login   {string name = 1;}

message LoginOk {
  uint32 player_id = 1;
  uint64 server_tick = 2;
  uint32 tick_rate = 3;
}

message Input {
  uint32 seq = 1;
  float  move_x = 2;
  float  move_y = 3;
}

message EntityState {
  uint32 id = 1;
  float  x = 2;
  float  y = 3;
  uint32 realm_id = 4;
}

message Snapshot {
  uint64 tick = 1;
  uint32 ack_seq = 2;
  repeated EntityState entities = 3;
}

message Ping {uint64 client_time_ms = 1;}
message Pong {uint64 client_time_ms = 1; uint64 server_time_ms = 2;}
